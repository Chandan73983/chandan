<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            background: #020024;
            background: linear-gradient(90deg, rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 35%, rgba(0, 212, 255, 1) 100%);
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 50px;
            border-radius: 25px;
            background: #833AB4;
            color: #ffffff;
            background: linear-gradient(90deg, rgba(131, 58, 180, 1) 0%, rgba(253, 29, 29, 1) 50%, rgba(252, 176, 69, 1) 100%);
        }

        .content h2 {
            text-align: center;
            font-size: 28px;
        }

        .content button {
            border: none;
            font-size: 20px;
            color: #fff;
            outline: none;
            background-image: linear-gradient(90deg, #020024 0%, #090979 35%, #00d4ff 100%);
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="content">
            <h1>Click Counter</h1>
            <h2 id="count">0</h2>
            <button onclick="increase()">+</button>
            <button onclick="decrease()">-</button>
            <button onclick="reset()">Reset</button>
        </div>
    </div>
    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").innerText = count;
        }


        function reset() {
            count = 0;
            document.getElementById("count").innerText = count;
        }
    </script>
</body>

</html>
