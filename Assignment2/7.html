<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            margin: 0;
            background: #ffffff;
            color: black;
            box-shadow: 0 4px 15px rgba(0, 0, 0, .5);
            padding: 50px;
            border-radius: 10px;
            width: 15%;
            text-align: center;
            transition: .3s;
        }
        
        .container:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, .8);
        }
        
        .content {
            margin: 0;
            font-size: 15px;
            font-weight: bold;
        }
        
        h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <h1>Card</h1>
    <div class="container">
        <div class="content">
            <img width="100" height="100" src="https://img.icons8.com/carbon-copy/100/toyota.png" alt="toyota" />
            <h2>Toyota</h2>
            <p>world Best Car</p>
            <p>Making A world Best Cars</p>
        </div>
    </div>
</body>

</html>
