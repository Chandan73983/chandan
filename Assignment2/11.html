<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .container {
            width: 560px;
        }
        
        h2 {
            text-align: center;
        }
    </style>
</head>

<body>
    <section class="container mt-5 p-5 shadow-lg p-3 mb-5 bg-body-tertiary rounded">
        <h2 class="mb-4">Regitration Form</h2>
        <form>
            <div class="mb-3">
                <label for="exampleInputName1" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="exampleInputName1" aria-describedby="emailHelp" placeholder="Full Name...">

            </div>

            <div class="mb-3">
                <label for="exampleInputPhone1" class="form-label">Phone</label>
                <input type="number" class="form-control" id="exampleInputPhone1" aria-describedby="emailHelp" placeholder="Phone...">

            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Email...">

            </div>



            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Password..." id="exampleInputPassword1">
            </div>

            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm Password..." id="exampleInputPassword1">
            </div>

            <label class="form-label mt-2">Gender:</label><br>


            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1" value="option1">
                <label class="form-check-label" for="inlineRadio1">Male</label>
            </div><br>
            <div class="form-check form-check-inline mt-2">
                <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2" value="option2">
                <label class="form-check-label" for="inlineRadio2">Female</label>
            </div><br>

            <label class="form-label mt-2">Skill:</label><br>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                    HTML
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkChecked">
                <label class="form-check-label" for="checkChecked">
                    CSS
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                <label class="form-check-label" for="checkDefault">
                    Javascipt
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="checkChecked">
                <label class="form-check-label" for="checkChecked">
                    PHP
                </label>
            </div>

            <label class="form-label mt-2">Courses:</label><br>
            <select class="form-select" aria-label="Default select example">
                <option selected>Select Your Course</option>
                <option value="1">HTML</option>
                <option value="2">CSS</option>
                <option value="3">Javascript</option>
                <option value="4">PHP</option>
            </select>

            <button type="submit" class="btn btn-primary mt-3">Submit</button>
        </form>
    </section>
</body>

</html>
