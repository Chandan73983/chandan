<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>

        <style>
            table {
                text-align: center;
            }
            tr th {
                padding: 10px 50px;
            }
        </style>
    </head>
    <body>
        <h1>Q3: Build a marksheet table using rowspan and colspan</h1>
        <table border="1">
            <tr>
                <th rowspan="2">Roll No</th>
                <th rowspan="2">Name</th>
                <th colspan="3">Marks</th>
                <th rowspan="2">Total</th>
            </tr>
            <tr>
                <th>Math</th>
                <th>Science</th>
                <th>English</th>
            </tr>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>80</td>
                <td>75</td>
                <td>90</td>
                <td>245</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Chandan</td>
                <td>90</td>
                <td>80</td>
                <td>99</td>
                <td>269</td>
            </tr>
            <tr>
              <td>103</td>
              <td>Prince</td>
              <td>77</td>
              <td>66</td>
              <td>80</td>
              <td>223</td>
            </tr>

        </table>
    </body>
</html>
