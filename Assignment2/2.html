<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document</title>
</head>

    <body>
      <h1>Q2:Create a registration form with text, email, password, radio, checkbox, select fields in plain HTML (Q2) </h1>
      
      <h2>Regitration Form</h2>
      <form>
        Name:
        <input type="text" placeholder="Inter your Name">
        <br><br>
         Email:
        <input type="email" placeholder="Inter your Email">
        <br><br>
         Password:
        <input type="password" placeholder="Inter your Password">
        <br><br>
        Gender:
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <br><br>
        Skill:
        <input type="checkbox">HTML
        <input type="checkbox">CSS
        <input type="checkbox">Javascript
        <input type="checkbox">PHP
        <br><br>
        Courses:
        <select>
          <option>Select Course</option>
          <option value="HTML">HTML</option>
          <option value="CSS">CSS</option>
          <option value="Javascript">Javascript</option>
          <option value="PHP">PHP</option>
        </select>
        <br><br>
        
        <button type="submit">Submit</button>
        
      </form>
    </body>
</html>
