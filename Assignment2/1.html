<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Document</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet" />

        <style>
            body {
                font-family: Arial, Sans-Serif;
            }
            section {
                margin-top: 50px;
                display: flex;
                height: 100vh;
                justify-content: center;
                align-items: center;
                width: 100%;
            }
            form {
                background: #e8e8e8;
                padding: 25px;
                border-radius: 15px;
            }
            label {
                font-size: 15px;
                font-weight: bold;
            }
            input,
            select {
                width: 100%;
                padding: 10px;
                border-radius: 8px;
                border: none;
                align-items: center;
                background: #fdfdfd;
            }
            input:focus,
            select:focus {
                outline: none;
                border: 1px solid blue;
            }

            .butt {
                padding: 10px 20px;
                border: none;
                border-radius: 8px;
                font-weight: bold;
                cursor: pointer;
                transition: 0.3s;
            }

            .butt:hover {
                background: #1b7afc;
                color: #fff;
                transform: translateY(-5px);
            }
            
            footer{
              bottom: 0;
              margin-top: 50px;
              background: black;
              color: white;
              text-align: center;
              padding: 10px;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-white shadow-sm sticky-top">
            <div class="container">
                <a class="navbar-brand fw-bold" href="#"
                    ><i class="bi bi-heart-pulse-fill text-danger me-2"></i>Wild
                    Wolf</a
                >
                <div class="d-flex align-items-center gap-2">
                    <button
                        class="navbar-toggler border-0"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                </div>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a
                                class="nav-link active"
                                href="#"
                                onclick="showDashboard()"
                                ><i class="bi bi-house"></i> Home</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showLevels()"
                                ><i class="bi bi-layers"></i> Levels</a
                            >
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" onclick="showStats()"
                                ><i class="bi bi-graph-up"></i> Stats</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#"
                                onclick="showBookmarks()"
                                ><i class="bi bi-bookmark"></i> Bookmarks</a
                            >
                        </li>
                        <li class="nav-item">
                            <a
                                class="nav-link"
                                href="#"
                                onclick="showSettings()"
                                ><i class="bi bi-gear"></i
                            ></a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <section>
            <form>
                <label>Name</label><br />
                <input type="text" placeholder="Inter your Name" />
                <br /><br />
                <label>Email</label><br />
                <input type="email" placeholder="Inter your Email" />
                <br /><br />
                <label>Password</label><br />
                <input type="password" placeholder="Inter your Password" />
                <br /><br />
                <label>Gender :</label><br />
                <input type="radio" name="gender" />Male
                <input type="radio" name="gender" />Female <br /><br />
                <label>Skill :</label><br />
                <input type="checkbox" />HTML <input type="checkbox" />CSS
                <input type="checkbox" />Javascript <input type="checkbox" />PHP
                <br /><br />
                <label>Course :</label><br />
                <select>
                    <option>Select Course</option>
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="Javascript">Javascript</option>
                    <option value="PHP">PHP</option>
                </select>
                <br /><br />

                <button class="butt" type="submit">Submit</button>
            </form>
        </section>
        <footer>
          <p>Copyright notice: Statement like © 2026 Company Name. All rights reserved.</p>
        </footer>
    </body>
</html>
